name: 每日更新A股数据

on:
  schedule:
    # 每个交易日（周一至周五）北京时间 15:05 = UTC 07:05
    - cron: '5 7 * * 1-5'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 更新行情数据
        run: node scripts/update-data.js

      - name: 检查是否有更新
        id: check
        run: |
          if [ -f .no-update ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "No new data, skipping commit."
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交更新
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          git push

      - name: 检出最新代码（含新数据）
        uses: actions/checkout@v4
        with:
          ref: main
          clean: false

      - name: 清理标记文件
        if: always()
        run: rm -f .no-update

      - name: 设置 Pages
        uses: actions/configure-pages@v4

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
